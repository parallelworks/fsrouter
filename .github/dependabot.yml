version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # wait for a release to age before adopting it, security updates are not delayed
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(deps)" }
    groups:
      js: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }
